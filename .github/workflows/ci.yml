name: CI

on:
  push:
    branches: [main, lithuania]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Syntax-check API sources
        run: |
          for f in $(find apps/api/src -name "*.js"); do node --check "$f"; done

      - name: Build web app
        run: npm run build --workspace=apps/web
